server:
  port: ${SERVER_PORT}

spring:
  application:
    name: exmoney
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_DEFAULT_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
    properties:
      hibernate:
        default_schema: ${DB_DEFAULT_SCHEMA}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: abc
            client-secret: dasd
          google:
            client-id: dasd
            client-secret: dsd
  mail:
    host: smtp.gmail.com
    port: 587
    username: exmoneyapplication@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}

  servlet:
    multipart:
      max-request-size: 3MB
      max-file-size: 3MB

exmoney:
  application:
    sender:
      email: exmoneysuppport@gmail.com
    oauth:
      google:
        api-get-info: https://www.googleapis.com/oauth2/v3/userinfo
      github:
        api-get-info: https://api.github.com/user
        api-valid-token: https://github.com/login/oauth/access_token
    default:
      wallet_name: "default.wallet_name"
      wallet_description: "default.wallet_description"
      expense_income_name: "default.expense_income_name"
      expense_income_description: "default.expense_income_description"
      otp_code_expire_time: 5 #5 minutes
#      categories:
#        - "default.category_home"
#        - "default.category_food"
#        - "default.category_fill"
#        - "default.category_phone"
#        - "default.category_pet"
#        - "default.category_relax"
#        - "default.category_tech"
#        - "default.category_other"
    action_log:
      email_send_to_client: "action.email_send_to_client"
      user_sign_in_google: "action.google_sign_in"
      user_sign_in_github: "action.github_sign_in"
      user_sign_in: "action.user_sign_in"
      user_sign_out: "action.user_sign_out"
      renew_access_token: "action.renew_access_token"
      user_update: "action.user_update"
      user_change_password: "action.user_change_password"
      user_update_avatar: "action.user_update_avatar"
      expense_category_create: "action.expense_category_create"
      expense_category_update: "action.expense_category_update"
      expense_category_delete: "action.expense_category_delete"
      wallet_create: "action.wallet_create"
      wallet_add_user: "action.wallet_add_user"
      wallet_remove_user: "action.wallet_remove_user"
      wallet_change_expense_limit: "action.wallet_change_expense_limit"
      expense_create: "action.expense_create"
      expense_update: "action.expense_update"
      expense_delete: "action.expense_delete"
      expense_speech_to_text: "action.expense_speech_to_text"
      task_schedule_expense: "action.task_schedule_expense"
      note_init: "action.note.init"
      note_update: "action.note.update"
      note_delete: "action.note.delete"